# docker-compose.dev.yml
services:
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_TIMEOUT: 600
        PIP_RETRIES: 10
        BUILDKIT_INLINE_CACHE: 1
    container_name: bioanalyzer-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Explicitly pass important env vars into the container (override with values from .env)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NCBI_API_KEY=${NCBI_API_KEY}
      - EMAIL=${EMAIL}
      - DEBUG=${DEBUG:-true}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PYTHONPATH=/app
      - WATCHFILES_FORCE_POLLING=true
      - API_TIMEOUT=${API_TIMEOUT:-60}
      - GEMINI_TIMEOUT=${GEMINI_TIMEOUT:-20}
      - ANALYSIS_TIMEOUT=${ANALYSIS_TIMEOUT:-50}
      # helpful for tests and dev
      - PIP_NO_CACHE_DIR=off
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Mount source code for live reloading
      - ./app:/app/app:rw
      - ./config:/app/config:ro
      - ./frontend:/app/frontend:rw
      # Data and cache volumes
      - ./data:/app/data:rw
      - ./cache:/app/cache:rw
      - ./results:/app/results:rw
      - ./.env:/app/.env:ro
      # Development volumes
      - ./logs:/app/logs:rw
    networks:
      - bioanalyzer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  nginx:
    build:
      context: .
      dockerfile: deployment/docker/nginx.Dockerfile
    container_name: bioanalyzer-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      analyzer:
        condition: service_healthy
    volumes:
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - bioanalyzer-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: bioanalyzer-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bioanalyzer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  nginx_logs:
  nginx_cache:
  redis_data:

networks:
  bioanalyzer-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
